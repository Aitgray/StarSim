[project]
name = "starsim"
version = "0.1.0"
description = "A space simulation game."
authors = [
    {name = "Your Name", email = "you@example.com"},
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "numpy",
    "scipy",
    "flask",
    "ruff",
    "pytest",
    "mypy",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
